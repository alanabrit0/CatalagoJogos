<app-header 
  [usuarioLogado]="usuarioLogado" 
  (loginToggle)="toggleLogin()">
</app-header>
<main>
  <section class="welcome-message">
    @if (usuarioLogado) {
      <p class="success">Bem-vindo, usuário! Você está logado.</p>
    } @else {
      <p class="alert">Você está visitando como convidado. Faça login para mais recursos.</p>
    }
  </section>
  <app-list 
    [jogos]="jogos" 
    (favoritar)="toggleFavorito($event)">
  </app-list>
</main>
<app-footer></app-footer>

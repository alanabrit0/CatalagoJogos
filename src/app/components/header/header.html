<header>
  <div class="logo">
    <h1>JOGOS</h1>
  </div>
  <nav>
    <a (click)="onNavegar('inicio')" [class.ativo]="secaoAtiva === 'inicio'">Início</a>
    <a (click)="onNavegar('catalogo')" [class.ativo]="secaoAtiva === 'catalogo'">Catálogo</a>
    <a (click)="onNavegar('sobre')" [class.ativo]="secaoAtiva === 'sobre'">Sobre</a>

    <div class="login-area">
      @if (usuarioLogado) {
        <span class="user-status">Logado</span>
      } @else {
        <span class="user-status">Visitante</span>
      }
      <button (click)="onLoginToggle()" class="btn-login">
        {{ usuarioLogado ? 'Sair' : 'Entrar' }}
      </button>
    </div>
  </nav>
</header>

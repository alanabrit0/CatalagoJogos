<section class="list">
  <h2>Catálogo de Jogos</h2>
  <div class="items-grid">
    @for (jogo of jogos; track jogo.id) {
      <app-card 
        [item]="jogo" 
        (favoritar)="onFavoritar($event)">
      </app-card>
    } @empty {
      <p>Nenhum jogo disponível no momento.</p>
    }
  </div>
</section>
